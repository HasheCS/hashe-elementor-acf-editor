name: Publish approved Hashe Field Editor independent release

# Never publish just because a tag was pushed. This workflow can only be
# invoked intentionally on the protected main branch after release approval.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing annotated stable tag, e.g. v0.6.0"
        required: true
        type: string
      explicit_approval:
        description: "Type PUBLISH-APPROVED-HASHE-FIELD-EDITOR after CEO signoff and HP-PLUG-001 gates"
        required: true
        type: string

permissions:
  contents: write

jobs:
  independent-stable:
    name: Verify and publish one immutable independent release ZIP
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing tagged main commit and explicit release approval
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
          APPROVAL: ${{ inputs.explicit_approval }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVAL" == "PUBLISH-APPROVED-HASHE-FIELD-EDITOR" ]] || { echo 'Explicit approval token missing'; exit 2; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Stable semver tag required'; exit 2; }
          git show-ref --verify --quiet "refs/tags/$TAG" || { echo 'Tag must exist before workflow starts'; exit 3; }
          [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]] || { echo 'Require an annotated, reviewed tag'; exit 3; }
          [[ "$(git rev-list -n 1 "$TAG")" == "$GITHUB_SHA" ]] || { echo 'Tag does not match protected main HEAD'; exit 3; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing public release'
            exit 4
          fi
          echo "TAG_VALIDATED=$TAG"
          echo "TAG_COMMIT=$GITHUB_SHA"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mandatory source regression and integrity checks
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          php -l hashe-elementor-acf-editor.php
          php -l includes/extended-fields.php
          php -l distribution/independent/bootstrap.php
          php -l distribution/independent/hashe-core/v1/update-client.php
          php -l distribution/independent/hashe-core/v1/consent-client.php
          php tests/php-smoke.php
          php tests/standalone-update-client.test.php
          php tests/standalone-consent-client.test.php
          php tests/site-proof.test.php
          node --check assets/editor-native.js
          node tests/js-smoke.cjs
          node tests/dirty-save.cjs
          node tests/delayed-baseline.cjs
          python3 tests/distribution-test.py
          VERSION="${TAG#v}"
          grep -Fq " * Version: $VERSION" hashe-elementor-acf-editor.php
          grep -Fq "Stable tag: $VERSION" readme.txt
          echo "RELEASE_SOURCE_REGRESSION=PASS"

      - name: Build and verify standalone ZIP from exact tagged source
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 tools/build_distributions.py --output dist-release
          (cd dist-release && sha256sum --check SHA256SUMS.txt)
          ZIP="dist-release/hashe-elementor-acf-editor-$TAG.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          unzip -Z1 "$ZIP" | grep -Fxq 'hashe-elementor-acf-editor/hashe-elementor-acf-editor.php'
          unzip -Z1 "$ZIP" | grep -Fxq 'hashe-elementor-acf-editor/includes/standalone-bootstrap.php'
          unzip -Z1 "$ZIP" | grep -Fxq 'hashe-elementor-acf-editor/includes/hashe-core/v1/update-client.php'
          unzip -Z1 "$ZIP" | grep -Fxq 'hashe-elementor-acf-editor/includes/hashe-core/v1/consent-client.php'
          (cd dist-release && sha256sum "hashe-elementor-acf-editor-$TAG.zip" > INDEPENDENT-SHA256SUMS.txt)
          echo "INDEPENDENT_ZIP_INTEGRITY=PASS"

      # WordPress.org has a separate directory identity and NO external updater.
      # Do not publish its ZIP here; submission is a separate authorized action.
      - name: Publish approved independent package (manual only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/hashe-elementor-acf-editor-${{ inputs.release_tag }}.zip
            dist-release/INDEPENDENT-SHA256SUMS.txt
