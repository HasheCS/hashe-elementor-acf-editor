name: Build WordPress plugin release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate code and release tag
        shell: bash
        run: |
          set -euo pipefail
          php -l hashe-elementor-acf-editor.php
          php tests/php-smoke.php
          node --check assets/editor-native.js
          node tests/js-smoke.cjs
          grep -q "Version: ${GITHUB_REF_NAME#v}" hashe-elementor-acf-editor.php
      - name: Build standalone WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=hashe-elementor-acf-editor
          mkdir -p "dist/$PLUGIN/assets"
          cp hashe-elementor-acf-editor.php readme.txt LICENSE "dist/$PLUGIN/"
          cp assets/editor-native.js assets/editor-native.css "dist/$PLUGIN/assets/"
          (
            cd dist
            zip -q -r "$PLUGIN-${GITHUB_REF_NAME}.zip" "$PLUGIN"
            sha256sum "$PLUGIN-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt
          )
          unzip -tq "dist/$PLUGIN-${GITHUB_REF_NAME}.zip"
      - name: Publish release ZIP
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/hashe-elementor-acf-editor-${{ github.ref_name }}.zip
            dist/SHA256SUMS.txt
