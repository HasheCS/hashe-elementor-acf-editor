name: Hashe Elementor ACF Editor CI

on:
  push:
    branches: ['main', 'release/**', 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax (plugin, ACF Pro adapters, tests)
        run: |
          set -euo pipefail
          php -l hashe-elementor-acf-editor.php
          php -l includes/extended-fields.php
          php -l distribution/independent/bootstrap.php
          php -l distribution/independent/hashe-core/v1/update-client.php
          php -l distribution/independent/hashe-core/v1/consent-client.php
          php -l tests/php-smoke.php
          php -l tests/standalone-update-client.test.php
          php -l tests/standalone-consent-client.test.php
      - name: WordPress / Elementor / ACF standalone security tests
        run: |
          set -euo pipefail
          php tests/php-smoke.php
          php tests/standalone-update-client.test.php
          php tests/standalone-consent-client.test.php

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Elementor native-control and save regression checks
        run: |
          set -euo pipefail
          node --check assets/editor-native.js
          node --check tests/js-smoke.cjs
          node --check tests/dirty-save.cjs
          node tests/js-smoke.cjs
          node tests/dirty-save.cjs

  distribution-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify both isolated candidate packages and hashes
        run: |
          set -euo pipefail
          python3 tests/distribution-test.py
          python3 tools/build_distributions.py --output dist-candidate
          unzip -q dist-candidate/hashe-field-editor-for-elementor-with-acf-v0.6.0-wporg.zip -d dist-candidate/wporg-check
          unzip -tq dist-candidate/hashe-elementor-acf-editor-v0.6.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: acf-v0.6.0-unpublished-candidate-packages
          path: |
            dist-candidate/*.zip
            dist-candidate/SHA256SUMS.txt
          if-no-files-found: error
      - name: WordPress.org Plugin Check on directory-only package
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist-candidate/wporg-check/hashe-field-editor-for-elementor-with-acf
