name: Hashe Elementor ACF Editor CI

on:
  push:
    branches: ['main', 'release/**', 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax (plugin, ACF Pro adapters, tests)
        run: |
          set -euo pipefail
          php -l hashe-elementor-acf-editor.php
          php -l includes/extended-fields.php
          php -l tests/php-smoke.php
      - name: WordPress / Elementor / ACF standalone security tests
        run: php tests/php-smoke.php

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Elementor native-control and save regression checks
        run: |
          set -euo pipefail
          node --check assets/editor-native.js
          node --check tests/js-smoke.cjs
          node --check tests/dirty-save.cjs
          node tests/js-smoke.cjs
          node tests/dirty-save.cjs
