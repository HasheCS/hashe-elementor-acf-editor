name: Hashe Elementor ACF Editor CI

on:
  push:
    branches: ['main', 'release/**', 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax (plugin, ACF Pro adapters, tests)
        run: |
          set -euo pipefail
          php -l hashe-elementor-acf-editor.php
          php -l includes/extended-fields.php
          php -l tests/php-smoke.php
      - name: WordPress / Elementor / ACF standalone security tests
        run: php tests/php-smoke.php

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Elementor native-control and save regression checks
        run: |
          set -euo pipefail
          node --check assets/editor-native.js
          node --check tests/js-smoke.cjs
          node --check tests/dirty-save.cjs
          node tests/js-smoke.cjs
          node tests/dirty-save.cjs

  wporg-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify WordPress.org submission candidate
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=hashe-elementor-acf-editor
          mkdir -p "dist/$PLUGIN/assets" "dist/$PLUGIN/includes"
          cp hashe-elementor-acf-editor.php readme.txt LICENSE "dist/$PLUGIN/"
          cp assets/editor-native.js assets/editor-native.css "dist/$PLUGIN/assets/"
          cp includes/extended-fields.php "dist/$PLUGIN/includes/"
          ( cd dist && zip -q -r "$PLUGIN-submission-candidate.zip" "$PLUGIN" )
          unzip -tq "dist/$PLUGIN-submission-candidate.zip"
          unzip -Z1 "dist/$PLUGIN-submission-candidate.zip" | grep -Fqx "$PLUGIN/hashe-elementor-acf-editor.php"
          unzip -Z1 "dist/$PLUGIN-submission-candidate.zip" | grep -Fqx "$PLUGIN/readme.txt"
          unzip -Z1 "dist/$PLUGIN-submission-candidate.zip" | grep -Fqx "$PLUGIN/LICENSE"
          if unzip -Z1 "dist/$PLUGIN-submission-candidate.zip" | grep -Eq '/(README\.md|QA\.md)$'; then
            echo 'FAIL: development-only markdown leaked into installable ZIP'
            exit 1
          fi
          echo 'PASS: Installable package structure and development-file exclusions'
      - uses: actions/upload-artifact@v4
        with:
          name: acf-editor-wporg-submission-candidate
          path: dist/hashe-elementor-acf-editor-submission-candidate.zip
          if-no-files-found: error
      - name: WordPress.org Plugin Check on actual distribution directory
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/hashe-elementor-acf-editor
